name: Clean deployment history

on:
  workflow_dispatch:

permissions:
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: List and delete old deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Fetching deployments for github-pages environment..."
          deployments=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/deployments?environment=github-pages&per_page=100")

          # Get deployment IDs (newest first), skip first one (latest)
          ids=($(echo "$deployments" | jq -r '.[].id'))
          total=${#ids[@]}

          if [ "$total" -le 1 ]; then
            echo "Only 1 or 0 deployments found. Nothing to clean up."
            exit 0
          fi

          echo "Found $total deployments. Keeping latest (ID: ${ids[0]}), deleting $((total - 1)) old ones..."

          for i in $(seq 1 $((total - 1))); do
            id=${ids[$i]}
            echo "Deleting deployment ID: $id"
            curl -s -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/deployments/$id" \
              -w "\nHTTP Status: %{http_code}\n" -o /dev/null
            sleep 1
          done

          echo "Done. Deployment history cleaned."
