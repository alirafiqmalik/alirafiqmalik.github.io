# Selected news shown in the right-side News window.
# Set selected: true to show an item in the panel.
# For paper announcements:
# - detail_url opens the local paper detail page when the news row is clicked.
# - paper_url is optional; when present, the paper title becomes an accent-green link.
# - venue_url is optional; when present, the conference name becomes an accent-green link.
news:
  - date: August 2026
    kind: paper
    prefix: "Paper on banking-system security, '"
