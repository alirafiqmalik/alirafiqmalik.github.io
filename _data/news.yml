# Selected news shown in the right-side News window.
# Set selected: true to show an item in the panel.
# For paper announcements:
# - publication: slug of a _publications/*.md record — title, venue, venue_url,
#   detail_url, and paper_url (arxiv/preprint link) are pulled from that record
#   so they can't drift from the publications list. prefix/suffix stay
#   hand-written editorial phrasing around the pulled facts.
# - paper_title overrides the record's short_title/title if set by hand.
news:
  - date: July 2026
    kind: paper
    publication: beyond-quantum-promise-qkd
    prefix: "Paper on quantum security, '"
    suffix: "', accepted to "
    selected: true
