extended_bio: |
  Hi, I am a PhD Candidate in Electrical & Computer Engineering @ [University of Massachusetts Amherst](https://www.umass.edu/). I work on formal methods, security verification, and model checking with [Dr. Muhammad Taqi Raza](https://people.umass.edu/taqi/) in [Khwarizmi Lab](https://khwarizmilab.github.io/).

  I study the formal specifications of large-scale network and communication systems for identifying vulnerabilities and mitigating risks like unauthorized access and denial-of-service. My research focuses on conducting comprehensive and systematic security analyses of modern digital systems through SAT-based bounded model checking and theorem proving. This includes scrutinizing the security functions and protocols within the U.S. ACH network, quantum-classical interfaces (QKD), and cross-plane eSIM connectivity to ensure the highest standard of protection for users and business assets. A systematic analysis of these security specifications not only enhances the resilience of systems but also ensures mathematically proven validation for complex control planes.

  My research paves the way for the development of effective remedies, ensuring the integrity and trustworthiness of digital systems in various operational contexts.

  Before joining UMass, I completed my Bachelor's in Electrical Engineering (BE) from [National University of Sciences and Technology (NUST)](https://nust.edu.pk/) in 2023. At NUST, I worked as an Undergraduate Research Assistant and Hardware Security Intern, focusing on autonomous aerial swarm robotics and logic-locking defenses for hardware security. Further details regarding my technical deployments and publications are available in [AliMalik_Resume.pdf](/assets/pdf/AliMalik_Resume.pdf).
