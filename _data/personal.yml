extended_bio: |
  I analyze the security specifications of large-scale network and communication systems. The goal is to find gaps such as unauthorized access and denial of service.

  Current targets are the U.S. ACH payment network, quantum-classical interfaces in QKD, and cross-plane eSIM connectivity. I use SAT-based bounded model checking and theorem proving.

  This is PhD work in Electrical & Computer Engineering at [University of Massachusetts Amherst](https://www.umass.edu/), with [Dr. Muhammad Taqi Raza](https://people.umass.edu/taqi/) in [Khwarizmi Lab](https://khwarizmilab.github.io/).

  Before UMass I completed a BE in Electrical Engineering at [National University of Sciences and Technology (NUST)](https://nust.edu.pk/) in 2023. There I worked on aerial swarm robotics and logic-locking defenses for hardware. More in the [CV](/assets/pdf/AliMalik_Resume.pdf).
