# Media coverage of the research, shown as a logo wall in the homepage
# "Research Featured In" section (#media).
#
# Only news media whose article discusses the paper and names the author.
# Each entry was checked against the live article text. Company blogs and
# daily digests that only list the story are left out.
#
# One entry per outlet; order here is display order. Each logo links to `url`.
# - name:   outlet name (used in the link label)
# - logo:   file under /assets/img/press/. Any colors are fine: the page shows
#           every logo as a single-color silhouette, so the file needs a
#           transparent background (no solid box behind the wordmark; cut the
#           text out of a box instead, as in skytg24.svg).
# - w / h:  the logo's intrinsic width and height (SVG viewBox or PNG pixels).
#           They reserve its space before it loads and size it by area, so
#           wide wordmarks and square marks look equally heavy.
# - url / title / date / lang: the article (lang is ISO 639-1).
# - publication: slug of the _publications/*.md record the article covers.
# - note:   provenance (syndication, republication).
outlets:
