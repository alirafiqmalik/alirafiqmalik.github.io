researchInterests:
  - title: Formal methods and security analysis
    description: I model deployed protocol stacks against their specs. That turns up access-control and trust-boundary gaps the specification never states.
  - title: Large language model reliability
    description: I treat LLM behavior as something to verify — whether a thinking trace matches the computation, and whether single-call guarantees hold for multi-step agents.
  - title: Quantum and post-quantum security
    description: I look for breaks at the classical edge of quantum deployments — control planes, key management, and migration — not the cryptographic primitive.

