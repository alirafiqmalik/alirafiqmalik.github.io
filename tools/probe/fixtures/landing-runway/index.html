<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Probe fixture: empty landing runway</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; font-family: sans-serif; }
    #page-scroll-container { height: 100vh; overflow-y: auto; }
    #landing, #about, #beyond { position: relative; height: 100vh; }
    #runway { height: 50vh; background: #eee; }
    [data-probe] { position: absolute; padding: 8px; background: #ddd; }
    [data-probe="nav"] { top: 8px; left: 8px; width: 120px; height: 34px; }
    [data-probe="name"] { top: 56px; left: calc(50% - 100px); width: 200px; height: 44px; }
    [data-probe="tagline"] { top: 108px; left: calc(50% - 120px); width: 240px; height: 34px; }
    [data-probe="news-card"] { right: 20px; bottom: 20px; width: 220px; height: 100px; }
    [data-probe="cta-social"] { left: 20px; bottom: 74px; width: 130px; height: 40px; }
    [data-probe="cta-links"] { left: 20px; bottom: 20px; width: 180px; height: 40px; }
    [data-probe="about-panel"] {
      top: calc(50% - 80px);
      left: 10%;
      width: 80%;
      height: 160px;
    }
    @media (max-width: 899px) {
      [data-probe="name"] { top: 52px; left: 16px; width: calc(100% - 32px); }
      [data-probe="tagline"] { top: 104px; left: 16px; width: calc(100% - 32px); }
      [data-probe="news-card"] { top: 154px; left: 16px; width: calc(100% - 32px); height: 100px; }
      [data-probe="cta-social"] { top: 270px; left: 16px; bottom: auto; }
      [data-probe="cta-links"] { top: 326px; left: 16px; bottom: auto; }
    }
  </style>
</head>
<body>
  <div id="page-scroll-container">
    <main>
      <section id="landing">
        <nav data-probe="nav">Nav</nav>
        <h1 data-probe="name">Name</h1>
        <p data-probe="tagline">Tagline</p>
        <div data-probe="news-card">News</div>
        <div data-probe="cta-social"><a href="#about">Social</a></div>
        <div data-probe="cta-links"><a href="#about">CV</a></div>
      </section>
      <div id="runway" aria-label="Deliberate empty runway"></div>
      <section id="about">
        <div data-probe="about-panel">About</div>
      </section>
      <section id="beyond">Beyond About</section>
    </main>
  </div>
</body>
</html>
