<!DOCTYPE html>
<html lang="en" class="one-page-scroll-root">
<head>
  {% include head.html %}
</head>
<body class="one-page-scroll" data-baseurl="{{ site.baseurl }}">
  <!-- Single scrim between the fixed globe and the scrolling content. Replaces
       the per-panel tints that produced the horizontal band artifact (#21). -->
  <div class="site-backdrop" aria-hidden="true"></div>
  <div class="site-wrapper site-wrapper-scroll">
    {% include navigation.html %}
    <div class="page-scroll-container" id="page-scroll-container" tabindex="0">
      <main class="main-content main-content-scroll">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
    <button type="button" class="panel-scroll-hint" data-scroll-direction="down" aria-label="Scroll to next section">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>
  <script src="{{ '/assets/js/landing-scroll.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/globe.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
